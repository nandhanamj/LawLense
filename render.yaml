services:
  - type: web
    name: lawlense-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && pip install gunicorn whitenoise && python backend/manage.py collectstatic --no-input && python backend/manage.py migrate
    startCommand: gunicorn --chdir backend config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: GROQ_API_KEY
        sync: false